name: Deploy Inquiry Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/inquiry/**"
      - ".github/workflows/deploy-inquiry-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inquiry-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: workers/inquiry/package-lock.json

      - name: Install dependencies
        working-directory: workers/inquiry
        run: npm ci

      - name: Test, typecheck, and build dry run
        working-directory: workers/inquiry
        run: npm run check

      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/inquiry
          command: deploy

      - name: Report missing deployment credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::notice::Worker checks passed; deployment was skipped because the Cloudflare repository secrets are not configured."
