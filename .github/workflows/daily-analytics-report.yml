name: Daily Analytics Report

on:
  schedule:
    # 08:30 Asia/Shanghai every day.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD. Defaults to yesterday in Asia/Shanghai."
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate daily analytics report
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
          REPORT_TIMEZONE: Asia/Shanghai
        run: npm run report:daily

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-analytics-report
          path: reports/*.md
