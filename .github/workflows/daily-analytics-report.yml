name: Daily Analytics Report

on:
  schedule:
    # 08:30 Asia/Shanghai every day.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD. Defaults to yesterday in Asia/Shanghai."
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check report configuration
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          missing=0
          for name in GA_PROPERTY_ID GSC_SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Secret::$name is required for the daily analytics report."
              missing=1
            fi
          done

          if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ] || [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ] || [ -n "$GOOGLE_OAUTH_REFRESH_TOKEN" ]; then
            for name in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do
              if [ -z "${!name}" ]; then
                echo "::error title=Incomplete Google OAuth Secrets::$name is required when using OAuth refresh token authentication."
                missing=1
              fi
            done
          elif [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            for name in GOOGLE_WORKLOAD_IDENTITY_PROVIDER GOOGLE_SERVICE_ACCOUNT_EMAIL; do
              if [ -z "${!name}" ]; then
                echo "::error title=Missing GitHub Secret::$name is required when GOOGLE_SERVICE_ACCOUNT_JSON is not used."
                missing=1
              fi
            done
          fi

          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::warning title=Feishu webhook not configured::FEISHU_WEBHOOK_URL is optional. The report will be saved as a GitHub Actions artifact, but it will not be pushed to Feishu."
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON == '' && env.GOOGLE_OAUTH_REFRESH_TOKEN == '' }}
        uses: google-github-actions/auth@v3
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}

      - name: Generate daily analytics report
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
          REPORT_TIMEZONE: Asia/Shanghai
        run: npm run report:daily

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-analytics-report
          path: reports/*.md
