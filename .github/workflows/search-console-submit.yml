name: Submit Search Console Sitemap

on:
  workflow_dispatch:
    inputs:
      sitemap_url:
        description: "Absolute sitemap URL to submit."
        required: true
        default: "https://calinmeters.com/sitemap.xml"

permissions:
  contents: read
  id-token: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Search Console configuration
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
        run: |
          missing=0

          if [ -z "$GSC_SITE_URL" ]; then
            echo "::error title=Missing GitHub Secret::GSC_SITE_URL is required."
            missing=1
          fi

          if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ] || [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ] || [ -n "$GOOGLE_OAUTH_REFRESH_TOKEN" ]; then
            for name in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do
              if [ -z "${!name}" ]; then
                echo "::error title=Incomplete Google OAuth Secrets::$name is required when using OAuth refresh token authentication."
                missing=1
              fi
            done
          elif [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            for name in GOOGLE_WORKLOAD_IDENTITY_PROVIDER GOOGLE_SERVICE_ACCOUNT_EMAIL; do
              if [ -z "${!name}" ]; then
                echo "::error title=Missing GitHub Secret::$name is required when GOOGLE_SERVICE_ACCOUNT_JSON is not used."
                missing=1
              fi
            done
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON == '' && env.GOOGLE_OAUTH_REFRESH_TOKEN == '' }}
        uses: google-github-actions/auth@v3
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}

      - name: Submit sitemap
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SITEMAP_URL: ${{ github.event.inputs.sitemap_url }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: npm run gsc:submit-sitemap
